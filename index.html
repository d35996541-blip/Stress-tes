<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layer 7 HTTP Flood - Live Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --text: #ff3333;
            --border: #440000;
            --glow: rgba(255, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hud-container {
            width: 90%;
            max-width: 700px;
            border: 1px solid var(--border);
            background: rgba(10, 0, 0, 0.8);
            padding: 30px;
            box-shadow: 0 0 20px var(--glow), inset 0 0 20px rgba(255, 0, 0, 0.1);
            position: relative;
        }

        /* Radar Scanner Effect */
        .hud-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 0, 0, 0.05) 3px,
                rgba(255, 0, 0, 0.05) 3px
            );
            pointer-events: none;
            z-index: 2;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--text);
        }

        .target-info {
            font-size: 0.9rem;
            color: #888;
            margin-top: 10px;
        }

        .target-info span { color: #fff; }

        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-box {
            background: rgba(255, 0, 0, 0.05);
            border: 1px solid var(--border);
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 0 10px var(--text);
        }

        .log-panel {
            height: 120px;
            background: #000;
            border: 1px solid var(--border);
            padding: 10px;
            font-size: 0.75rem;
            color: #aaa;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .log-line {
            margin: 2px 0;
        }
        .log-line.error { color: var(--text); }
        .log-line.success { color: #555; }

        .btn-strike {
            width: 100%;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--text);
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-strike:hover, .btn-strike.active {
            background: var(--text);
            color: var(--bg);
            box-shadow: 0 0 20px var(--text);
        }

        .server-down {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            background: rgba(255,0,0,0.9);
            padding: 20px 40px;
            border: 2px solid #fff;
            text-shadow: 0 0 20px #000;
            box-shadow: 0 0 50px red;
            display: none;
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="hud-container">
        <div class="server-down" id="downAlert">SERVER DOWN<br><span style="font-size:1rem; font-weight:300;">CONNECTION REFUSED</span></div>

        <div class="header">
            <h1>NETWORK STRESS PROTOCOL</h1>
            <div class="target-info">TARGET URI: <span id="targetUrl">DETECTING...</span></div>
        </div>

        <div class="monitor-grid">
            <div class="metric-box">
                <div class="metric-label">Requests Sent</div>
                <div class="metric-value" id="reqCount">0</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Errors / Dropped</div>
                <div class="metric-value" id="errCount">0</div>
            </div>
        </div>

        <div class="log-panel" id="logPanel">
            <div class="log-line">> AWAITING COMMAND...</div>
        </div>

        <button class="btn-strike" id="strikeBtn" onclick="initiateStrike()">INITIATE SELF-DDOS</button>
    </div>

    <script>
        let isAttacking = false;
        let requests = 0;
        let errors = 0;
        let attackIntervals = [];
        
        // Target adalah URL website ini sendiri
        const target = window.location.href.split('?')[0]; 
        document.getElementById('targetUrl').innerText = target;

        const logPanel = document.getElementById('logPanel');
        
        function log(msg, type = 'success') {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            line.innerText = `> ${msg}`;
            logPanel.appendChild(line);
            if (logPanel.children.length > 7) {
                logPanel.removeChild(logPanel.firstChild);
            }
        }

        // Fungsi menembak 1 request
        async function fireRequest() {
            // Tambah parameter random agar server tidak bisa menggunakan cache
            const cacheBuster = `?stress=${Math.random().toString(36).substring(7)}`;
            
            try {
                // Menggunakan mode no-cors agar browser mengabaikan keamanan lintas origin sementara
                const response = await fetch(target + cacheBuster, {
                    method: 'GET',
                    mode: 'no-cors',
                    cache: 'no-store'
                });
                
                requests++;
                // Jika request mengembalikan status selain 200-299 atau gagal terhubung
                if (response.status === 429 || response.status >= 500 || response.type === 'error') {
                    errors++;
                    log(`HTTP ${response.status || 'FAIL'} - PAYLOAD DROPPED`, 'error');
                } else {
                    if (requests % 10 === 0) log(`PAYLOAD DELIVERED (${requests})`);
                }
            } catch (e) {
                requests++;
                errors++;
                log(`CONNECTION REFUSED - TARGET UNREACHABLE`, 'error');
            }
            
            updateMonitor();
        }

        function updateMonitor() {
            document.getElementById('reqCount').innerText = requests.toLocaleString();
            document.getElementById('errCount').innerText = errors.toLocaleString();

            // Jika error terlalu banyak, asumsikan server down atau memblokir IP kita
            if (errors > 150) {
                declareVictory();
            }
        }

        function initiateStrike() {
            if (isAttacking) return;
            isAttacking = true;
            
            const btn = document.getElementById('strikeBtn');
            btn.classList.add('active');
            btn.innerText = "ATTACK IN PROGRESS...";
            btn.classList.add('blink');

            log("INITIATING LAYER 7 HTTP FLOOD...");
            log(`LOCKING TARGET: ${target}`);

            // Jalankan 30 thread bersamaan yang menembak tanpa jeda
            for(let i = 0; i < 30; i++) {
                let interval = setInterval(fireRequest, 50); // Tiap thread menembak setiap 50ms
                attackIntervals.push(interval);
            }
        }

        function declareVictory() {
            if (!isAttacking) return;
            // Hentikan tembakan
            attackIntervals.forEach(clearInterval);
            
            document.getElementById('strikeBtn').classList.remove('blink');
            document.getElementById('strikeBtn').innerText = "TARGET NEUTRALIZED";
            
            // Tampilkan Alert Merah Besar
            document.getElementById('downAlert').style.display = 'block';
            log("TARGET IS OFFLINE / RATE LIMITED.", 'error');
        }
    </script>
</body>
</html>
